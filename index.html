om:1px solid #111}.chapter{padding:30px 0;border-bottom:1px solid var(--line)}.chapter h3{font-size:2rem;font-weight:500}.chapter p{line-height:1.85}
    .portfolio-wrap{padding:0 max(18px,env(safe-area-inset-right)) 75px max(18px,env(safe-area-inset-left))}.portfolio-frame{width:min(100%,1200px);margin:auto;border-top:1px solid #444}.project-card{display:grid;grid-template-columns:1fr 1fr;min-height:520px}.project-media{position:relative;overflow:hidden;background:#eee;color:#050505}.project-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center}.project-label,.project-number{position:absolute;z-index:1}.project-label{top:28px;left:28px}.project-number{bottom:28px;left:28px;font-size:9rem;font-weight:600;line-height:.7}.project-copy{padding:40px;border-left:1px solid #444}.project-copy h3{margin:0 0 24px;font-size:clamp(3rem,7vw,6rem);font-weight:500;letter-spacing:-.06em;line-height:.9}.project-copy p{color:#aaa;line-height:1.75}.carousel{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;padding:15px 0}.carousel button{width:48px;height:48px;border:1px solid #666;border-radius:50%;background:none;color:#fff;font-size:1.5rem}.carousel button:active{background:#fff;color:#000}.carousel-count{text-align:center;font-size:.75rem;letter-spacing:.1em}.empty-project{padding:80px 20px;text-align:center;border:1px solid #333;color:#aaa}
    .admin-page{min-height:100vh;padding:70px 20px 90px;background:#f0f0f0;color:#050505}.admin-wrap{width:min(100%,980px);margin:auto}.admin-head{display:flex;justify-content:space-between;align-items:start;gap:20px}.admin-head h2{margin:0;font-size:clamp(2.6rem,7vw,5rem);font-weight:500;letter-spacing:-.06em;line-height:.9}.admin-head button{padding:12px 15px;border:1px solid #111;background:#fff}.admin-card{margin-top:24px;padding:22px;background:#fff;border:1px solid #ccc}.admin-card h3{margin:0 0 18px;font-size:1.4rem}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:13px}.field label{display:block;margin-bottom:6px;font-size:.78rem;font-weight:600}.field input,.field textarea{width:100%;padding:10px;border:1px solid #aaa;border-radius:0;background:#fff;color:#111}.field textarea{min-height:75px;resize:vertical}.repeat-group{margin-top:22px;padding-top:18px;border-top:1px solid #ddd}.repeat-group h4{margin:0 0 12px}.repeat-list{display:grid;gap:12px}.repeat-item,.project-edit{padding:14px;border:1px solid #bbb;background:#fafafa}.row-actions{display:flex;justify-content:flex-end;gap:8px}.small-btn{padding:7px 10px;border:1px solid var(--blue);background:#fff;color:var(--blue);font-size:.72rem}.danger{border-color:#c33;color:#c33}.project-list{display:grid;gap:18px}.project-edit h4{margin:0 0 12px}.thumbnail-editor{display:grid;grid-template-columns:260px 1fr;gap:16px;margin-top:12px}.thumb-preview{position:relative;height:190px;overflow:hidden;background:#ddd}.thumb-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center}.thumb-empty{display:grid;height:100%;place-items:center;color:#777}.thumb-controls label{display:block;margin:8px 0;font-size:.75rem}.thumb-controls input[type=range]{width:100%;accent-color:var(--blue)}.admin-actions{position:sticky;bottom:10px;display:flex;gap:9px;margin-top:24px;padding:10px;background:rgba(240,240,240,.94)}.primary{padding:13px 17px;border:0;background:var(--blue);color:#fff;font-weight:600}.secondary{padding:13px 17px;border:1px solid #111;background:#fff;color:#111}
    dialog{width:min(calc(100% - 25px),460px);padding:0;border:1px solid #555;background:#080808;color:#fff}dialog::backdrop{background:rgba(0,0,0,.75)}.dialog-head{display:flex;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #444}.dialog-close{border:0;background:none;color:#fff;font-size:1.4rem}.dialog-body{padding:20px}.dialog-body label{display:block;margin:12px 0 6px;font-size:.75rem}.dialog-body input{width:100%;padding:11px;border:1px solid #666;background:#000;color:#fff}.dialog-submit{width:100%;margin-top:18px;padding:12px;border:0;background:#fff;color:#000}.error{min-height:1.2em;color:#ff9292;font-size:.78rem}.footer{padding:32px 20px calc(32px + env(safe-area-inset-bottom));font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
    @media(max-width:720px){.resume-top{grid-template-columns:100px 1fr}.profile{min-height:165px}.resume-grid{grid-template-columns:1fr}.project-card{grid-template-columns:1fr}.project-media{min-height:310px}.project-copy{min-height:330px;border-top:1px solid #444;border-left:0}.project-number{font-size:6rem}.form-grid,.thumbnail-editor{grid-template-columns:1fr}.thumb-preview{height:220px}.admin-head{display:block}.admin-head button{margin-top:18px}}
    @media(max-width:430px){.resume-top{grid-template-columns:1fr}.profile{min-height:220px}}

<body>
  <header class="site-header" id="siteHeader"><div class="header-row"><h1 class="brand" id="brandName">김지원</h1><button class="admin-open" id="adminOpen" type="button">관리자 로그인</button></div><nav class="tabs" role="tablist" aria-label="페이지 메뉴"><button class="tab" role="tab" aria-selected="true" data-tab="resume">이력서</button><button class="tab" role="tab" aria-selected="false" data-tab="letter">자기소개서</button><button class="tab" role="tab" aria-selected="false" data-tab="portfolio">포트폴리오</button></nav></header>
  <main id="publicPage">
    <section class="panel" id="resume"><div class="hero"><p class="eyebrow">Curriculum Vitae / Version 12</p><h2>Resume<br><span class="outline">Archive.</span></h2></div><div class="stage"><article class="paper"><div class="resume-top"><div class="profile"><img id="profileView" alt="프로필 사진" hidden><span>Profile / Photo</span></div><div class="identity"><h2 id="resumeNameView">김지원</h2><p class="logline"><span class="field-label">로그라인</span><span id="loglineView"></span></p><dl class="meta"><div><dt>생년월일</dt><dd id="birthView"></dd></div><div><dt>연락처</dt><dd id="phoneView"></dd></div><div><dt>이메일</dt><dd id="emailView"></dd></div><div><dt>주소</dt><dd id="addressView"></dd></div></dl></div></div><hr class="blue-rule"><div class="resume-grid" id="resumeSections"></div></article></div></section>
    <section class="panel white-panel" id="letter" hidden><div class="hero"><p class="eyebrow">Cover Letter / Four Chapters</p><h2>About<br><span class="outline" style="-webkit-text-stroke-color:#050505">Myself.</span></h2></div><div class="stage"><article class="paper" id="letterView"></article></div></section>
    <section class="panel" id="portfolio" hidden><div class="hero"><p class="eyebrow">Game Projects / Selected Works</p><h2>Play<br><span class="outline">The Work.</span></h2></div><div class="portfolio-wrap"><div class="portfolio-frame"><div id="projectView"></div><div class="carousel" id="carousel"><button id="prevProject" type="button" aria-label="이전 프로젝트">←</button><span class="carousel-count" id="projectCount"></span><button id="nextProject" type="button" aria-label="다음 프로젝트">→</button></div></div></div></section>
  </main>
  <section class="admin-page" id="adminPage" hidden><div class="admin-wrap"><div class="admin-head"><div><p class="eyebrow">Admin / Content Manager</p><h2>편집<br>페이지.</h2></div><button id="viewSiteTop" type="button">웹페이지 보기</button></div><div class="admin-card"><h3>기본 정보</h3><div class="form-grid" id="basicEditor"></div></div><div class="admin-card"><h3>이력서 항목</h3><div id="resumeEditor"></div></div><div class="admin-card"><h3>자기소개서</h3><div id="letterEditor"></div></div><div class="admin-card"><h3>포트폴리오 프로젝트</h3><div class="project-list" id="projectEditor"></div><button class="small-btn" id="addProject" type="button">+ 프로젝트 추가</button></div><div class="admin-actions"><button class="primary" id="saveAndView" type="button">저장하고 웹페이지 보기</button><button class="secondary" id="viewSiteBottom" type="button">저장하지 않고 나가기</button></div></div></section>
  <footer class="footer" id="siteFooter">© 2026 Portfolio</footer>
  <dialog id="loginDialog"><div class="dialog-head"><b>관리자 로그인</b><button class="dialog-close" id="loginClose" type="button">×</button></div><form class="dialog-body" id="loginForm"><label for="loginUser">아이디</label><input id="loginUser" required><label for="loginPassword">비밀번호</label><input id="loginPassword" type="password" minlength="4" required><button class="dialog-submit" type="submit">로그인 / 계정 만들기</button><p class="error" id="loginError"></p></form></dialog>
  <script>
  (function(){
    'use strict';
    var STORAGE='portfolio-v12-data',ACCOUNT='portfolio-v12-account',currentProject=0;
    var labels={education:'학력',projects:'참여 프로젝트',career:'기타 경력',skills:'보유 기술',licenses:'자격증',military:'병역 사항',activities:'대외활동'};
    var defaults={name:'김지원',logline:'복잡한 문제를 선명한 경험으로 바꾸는 기획자이자 제작자입니다.',birth:'1997. 01. 01',phone:'010-0000-0000',email:'hello@example.com',address:'서울특별시',profile:'',resume:{education:[{title:'한동대학교 커뮤니케이션학부',period:'2016.03 — 2023.02',desc:'커뮤니케이션 전공'}],projects:[{title:'프로젝트 이름 · 담당 역할',period:'2025',desc:'주요 성과를 입력하세요.'}],career:[{title:'회사명 · 직무',period:'2023 — 2024',desc:''}],skills:[{title:'Planning · Research · Figma',period:'',desc:''}],licenses:[{title:'자격증명 · 발급기관',period:'',desc:''}],military:[{title:'병역 정보',period:'',desc:''}],activities:[{title:'활동명 · 기관명',period:'',desc:''}]},letter:[{title:'문제를 정확히 정의합니다.',body:'좋은 결과는 선명한 질문에서 시작한다고 믿습니다.'},{title:'끝까지 만드는 사람입니다.',body:'아이디어를 실제 결과물로 완성합니다.'},{title:'협업의 언어를 설계합니다.',body:'명확한 문서로 서로 다른 관점을 연결합니다.'},{title:'배운 것을 다음에 연결합니다.',body:'경험을 다음 프로젝트의 기준으로 전환합니다.'}],portfolio:[{title:'Project One',desc:'게임 프로젝트의 문제, 역할, 결과를 소개하세요.',image:'',scale:100,x:50,y:50},{title:'Project Two',desc:'기획 의도와 제작 과정을 입력하세요.',image:'',scale:100,x:50,y:50},{title:'Project Three',desc:'시스템과 성과를 입력하세요.',image:'',scale:100,x:50,y:50}]};
    function clone(v){return JSON.parse(JSON.stringify(v))}function load(){try{return Object.assign(clone(defaults),JSON.parse(localStorage.getItem(STORAGE)||'{}'))}catch(e){return clone(defaults)}}function save(data){localStorage.setItem(STORAGE,JSON.stringify(data))}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}
    function renderPublic(){var d=load();document.getElementById('brandName').textContent=d.name;document.getElementById('resumeNameView').textContent=d.name;['logline','birth','phone','email','address'].forEach(function(k){document.getElementById(k+'View').textContent=d[k]});var profile=document.getElementById('profileView');if(d.profile){profile.src=d.profile;profile.hidden=false}else{profile.hidden=true}var sections=document.getElementById('resumeSections');sections.innerHTML='';Object.keys(labels).forEach(function(k,i){var s=document.createElement('section');s.className='resume-section';s.innerHTML='<h3>'+labels[k]+'</h3>'+d.resume[k].map(function(v){return '<div class="public-entry"><strong>'+esc(v.title)+'</strong><small>'+esc(v.period)+'</small>'+(v.desc?'<p>'+esc(v.desc)+'</p>':'')+'</div>'}).join('');sections.appendChild(s)});document.getElementById('letterView').innerHTML=d.letter.map(function(v){return '<section class="chapter"><h3>'+esc(v.title)+'</h3><p>'+esc(v.body)+'</p></section>'}).join('');renderProject()}
    function renderProject(){var d=load(),items=d.portfolio,view=document.getElementById('projectView'),carousel=document.getElementById('carousel');if(!items.length){view.innerHTML='<div class="empty-project">등록된 프로젝트가 없습니다.</div>';carousel.hidden=true;return}currentProject=Math.max(0,Math.min(currentProject,items.length-1));var p=items[currentProject],img=p.image?'<img src="'+p.image+'" alt="'+esc(p.title)+' 썸네일" style="transform:scale('+(p.scale/100)+');object-position:'+p.x+'% '+p.y+'%">':'';view.innerHTML='<article class="project-card"><div class="project-media">'+img+'<span class="project-label">PROJECT / '+String(currentProject+1).padStart(2,'0')+'</span><strong class="project-number">'+String(currentProject+1).padStart(2,'0')+'</strong></div><div class="project-copy"><h3>'+esc(p.title)+'</h3><p>'+esc(p.desc)+'</p></div></article>';document.getElementById('projectCount').textContent=String(currentProject+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0');carousel.hidden=items.length<2}
    function field(label,key,type){var w=document.createElement('div');w.className='field';w.innerHTML='<label>'+label+'</label>'+(type==='textarea'?'<textarea data-basic="'+key+'"></textarea>':'<input data-basic="'+key+'" type="'+(type||'text')+'">');return w}
    function renderAdmin(){var d=load(),basic=document.getElementById('basicEditor');basic.innerHTML='';[['이름','name'],['로그라인','logline','textarea'],['생년월일','birth'],['연락처','phone'],['이메일','email'],['주소','address']].forEach(function(v){var w=field(v[0],v[1],v[2]);w.querySelector('[data-basic]').value=d[v[1]];basic.appendChild(w)});var pf=field('프로필 사진','profile','file');pf.querySelector('input').removeAttribute('data-basic');pf.querySelector('input').accept='image/*';pf.querySelector('input').onchange=function(){readImage(this.files[0],function(url){d.profile=url;save(d);renderAdmin()})};basic.appendChild(pf);var re=document.getElementById('resumeEditor');re.innerHTML='';Object.keys(labels).forEach(function(k){var g=document.createElement('section');g.className='repeat-group';g.innerHTML='<h4>'+labels[k]+'</h4><div class="repeat-list" data-resume-list="'+k+'"></div><button class="small-btn" type="button">+ 항목 추가</button>';var list=g.querySelector('.repeat-list');d.resume[k].forEach(function(v){list.appendChild(resumeItem(v))});g.querySelector('button').onclick=function(){list.appendChild(resumeItem({title:'',period:'',desc:''}))};re.appendChild(g)});document.getElementById('letterEditor').innerHTML=d.letter.map(function(v,i){return '<div class="repeat-item"><div class="field"><label>'+(i+1)+'문단 제목</label><input data-letter-title="'+i+'" value="'+esc(v.title)+'"></div><div class="field"><label>본문</label><textarea data-letter-body="'+i+'">'+esc(v.body)+'</textarea></div></div>'}).join('');var pe=document.getElementById('projectEditor');pe.innerHTML='';d.portfolio.forEach(function(v,i){pe.appendChild(projectEditor(v,i))})}
    function resumeItem(v){var b=document.createElement('div');b.className='repeat-item';b.innerHTML='<div class="form-grid"><div class="field"><label>제목</label><input class="ri-title"></div><div class="field"><label>기간</label><input class="ri-period"></div></div><div class="field"><label>상세 설명</label><textarea class="ri-desc"></textarea></div><div class="row-actions"><button class="small-btn danger" type="button">삭제</button></div>';b.querySelector('.ri-title').value=v.title;b.querySelector('.ri-period').value=v.period;b.querySelector('.ri-desc').value=v.desc;b.querySelector('.danger').onclick=function(){b.remove()};return b}
    function projectEditor(v,i){var b=document.createElement('article');b.className='project-edit';b.dataset.image=v.image||'';b.innerHTML='<h4>프로젝트 '+(i+1)+'</h4><div class="form-grid"><div class="field"><label>제목</label><input class="pi-title"></div><div class="field"><label>썸네일 사진</label><input class="pi-file" type="file" accept="image/*"></div></div><div class="field"><label>설명</label><textarea class="pi-desc"></textarea></div><div class="thumbnail-editor"><div class="thumb-preview"><img alt="썸네일 미리보기"><span class="thumb-empty">이미지를 등록하세요</span></div><div class="thumb-controls"><label>크기 <input class="pi-scale" type="range" min="100" max="220"></label><label>가로 위치 <input class="pi-x" type="range" min="0" max="100"></label><label>세로 위치 <input class="pi-y" type="range" min="0" max="100"></label><div class="row-actions"><button class="small-btn clear-image" type="button">이미지 삭제</button><button class="small-btn danger remove-project" type="button">프로젝트 삭제</button></div></div></div>';b.querySelector('.pi-title').value=v.title;b.querySelector('.pi-desc').value=v.desc;b.querySelector('.pi-scale').value=v.scale;b.querySelector('.pi-x').value=v.x;b.querySelector('.pi-y').value=v.y;var img=b.querySelector('.thumb-preview img'),empty=b.querySelector('.thumb-empty');function preview(){if(b.dataset.image){img.src=b.dataset.image;img.hidden=false;empty.hidden=true;img.style.transform='scale('+(b.querySelector('.pi-scale').value/100)+')';img.style.objectPosition=b.querySelector('.pi-x').value+'% '+b.querySelector('.pi-y').value+'%'}else{img.hidden=true;empty.hidden=false}}b.querySelector('.pi-file').onchange=function(){readImage(this.files[0],function(url){b.dataset.image=url;preview()})};['.pi-scale','.pi-x','.pi-y'].forEach(function(s){b.querySelector(s).oninput=preview});b.querySelector('.clear-image').onclick=function(){b.dataset.image='';b.querySelector('.pi-file').value='';preview()};b.querySelector('.remove-project').onclick=function(){b.remove();renumberProjects()};preview();return b}
    function renumberProjects(){document.querySelectorAll('.project-edit h4').forEach(function(h,i){h.textContent='프로젝트 '+(i+1)})}function readImage(file,done){if(!file)return;var reader=new FileReader();reader.onload=function(){var source=new Image();source.onload=function(){var max=1400,ratio=Math.min(1,max/Math.max(source.width,source.height)),canvas=document.createElement('canvas');canvas.width=Math.round(source.width*ratio);canvas.height=Math.round(source.height*ratio);canvas.getContext('2d').drawImage(source,0,0,canvas.width,canvas.height);done(canvas.toDataURL('image/jpeg',.82))};source.src=reader.result};reader.readAsDataURL(file)}
    function collectAdmin(){var d=load();document.querySelectorAll('[data-basic]').forEach(function(el){d[el.dataset.basic]=el.value});Object.keys(labels).forEach(function(k){d.resume[k]=Array.from(document.querySelectorAll('[data-resume-list="'+k+'"] .repeat-item')).map(function(b){return{title:b.querySelector('.ri-title').value,period:b.querySelector('.ri-period').value,desc:b.querySelector('.ri-desc').value}})});d.letter=Array.from(document.querySelectorAll('#letterEditor .repeat-item')).map(function(b){return{title:b.querySelector('[data-letter-title]').value,body:b.querySelector('[data-letter-body]').value}});d.portfolio=Array.from(document.querySelectorAll('.project-edit')).map(function(b){return{title:b.querySelector('.pi-title').value,desc:b.querySelector('.pi-desc').value,image:b.dataset.image||'',scale:+b.querySelector('.pi-scale').value,x:+b.querySelector('.pi-x').value,y:+b.querySelector('.pi-y').value}});save(d)}
    function showAdmin(){document.getElementById('publicPage').hidden=true;document.getElementById('siteHeader').hidden=true;document.getElementById('siteFooter').hidden=true;document.getElementById('adminPage').hidden=false;renderAdmin();scrollTo(0,0)}function showSite(){document.getElementById('adminPage').hidden=true;document.getElementById('publicPage').hidden=false;document.getElementById('siteHeader').hidden=false;document.getElementById('siteFooter').hidden=false;renderPublic();scrollTo(0,0)}
    document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',x===t?'true':'false')});document.querySelectorAll('.panel').forEach(function(p){p.hidden=p.id!==t.dataset.tab});scrollTo(0,0)}});document.getElementById('prevProject').onclick=function(){var n=load().portfolio.length;if(n){currentProject=(currentProject-1+n)%n;renderProject()}};document.getElementById('nextProject').onclick=function(){var n=load().portfolio.length;if(n){currentProject=(currentProject+1)%n;renderProject()}};document.getElementById('addProject').onclick=function(){document.getElementById('projectEditor').appendChild(projectEditor({title:'새 프로젝트',desc:'',image:'',scale:100,x:50,y:50},document.querySelectorAll('.project-edit').length));renumberProjects()};
    var dialog=document.getElementById('loginDialog');document.getElementById('adminOpen').onclick=function(){document.getElementById('loginError').textContent='';dialog.showModal()};document.getElementById('loginClose').onclick=function(){dialog.close()};document.getElementById('loginForm').onsubmit=function(e){e.preventDefault();var u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPassword').value,a=localStorage.getItem(ACCOUNT),value=u+'|'+hash(p);if(p.length<4){document.getElementById('loginError').textContent='비밀번호는 4자 이상이어야 합니다.';return}if(a&&a!==value){document.getElementById('loginError').textContent='아이디 또는 비밀번호가 맞지 않습니다.';return}if(!a)localStorage.setItem(ACCOUNT,value);dialog.close();showAdmin()};document.getElementById('saveAndView').onclick=function(){collectAdmin();showSite()};document.getElementById('viewSiteTop').onclick=showSite;document.getElementById('viewSiteBottom').onclick=showSite;renderPublic();
  }());
  </script>
